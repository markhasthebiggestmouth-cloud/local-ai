<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Local AI v5</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* NEW WALLPAPER - VERSION 5 */
body {
    background:
        radial-gradient(circle at 15% 20%, #7c3aed 0%, transparent 28%),
        radial-gradient(circle at 85% 15%, #06b6d4 0%, transparent 25%),
        radial-gradient(circle at 70% 85%, #ec4899 0%, transparent 30%),
        linear-gradient(135deg, #050816, #111827 45%, #020617);
    color: white;
}

/* Main window */
#app {
    position: absolute;
    width: 300px;
    height: 300px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    background: rgba(8, 12, 25, 0.92);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 35px rgba(124,58,237,.25);

    backdrop-filter: blur(18px);
    overflow: hidden;
}

/* Header */
#header {
    height: 42px;
    display: flex;
    align-items: center;
    padding: 0 12px;

    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.08);

    cursor: grab;
    user-select: none;
    touch-action: none;
}

#header:active {
    cursor: grabbing;
}

#dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #a855f7;
    box-shadow: 0 0 12px #a855f7;
    margin-right: 8px;
}

#title {
    font-size: 13px;
    font-weight: 700;
}

#version {
    margin-left: auto;
    font-size: 9px;
    opacity: .5;
}

/* Status */
#statusArea {
    padding: 10px 12px 6px;
}

#status {
    font-size: 11px;
    color: #cbd5e1;
    margin-bottom: 6px;
}

/* Progress */
#progressOuter {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: 99px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b5cf6, #06b6d4);
    border-radius: 99px;
    transition: width .2s ease;
}

#progressText {
    margin-top: 4px;
    font-size: 9px;
    color: #94a3b8;
}

/* Heat */
#heatBox {
    margin: 4px 12px 6px;
    padding: 7px 9px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;
}

#heatTop {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    margin-bottom: 5px;
}

#heatValue {
    font-weight: 700;
}

#heatOuter {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 99px;
    overflow: hidden;
}

#heatBar {
    width: 8%;
    height: 100%;
    background: #22c55e;
    border-radius: 99px;
    transition: width .5s ease, background .5s ease;
}

#heatNote {
    margin-top: 4px;
    font-size: 8px;
    color: #64748b;
}

/* Chat */
#chat {
    position: absolute;
    left: 0;
    right: 0;
    top: 145px;
    bottom: 48px;

    padding: 8px 11px;
    overflow-y: auto;

    font-size: 11px;
}

.msg {
    margin-bottom: 8px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
}

.user {
    color: #c4b5fd;
}

.bot {
    color: #e2e8f0;
}

.label {
    font-weight: 700;
}

/* Input */
#inputArea {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;

    display: flex;
    gap: 6px;
}

#input {
    flex: 1;
    min-width: 0;

    height: 32px;
    padding: 0 9px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px;

    background: rgba(255,255,255,.06);
    color: white;
    outline: none;

    font-size: 11px;
}

#input:focus {
    border-color: rgba(139,92,246,.7);
}

#send {
    width: 48px;
    border: 0;
    border-radius: 9px;

    background: #7c3aed;
    color: white;
    font-weight: 700;

    cursor: pointer;
}

#send:disabled {
    opacity: .4;
    cursor: default;
}
</style>
</head>

<body>

<div id="app">

    <div id="header">
        <div id="dot"></div>
        <div id="title">Local Qwen AI</div>
        <div id="version">V5</div>
    </div>

    <div id="statusArea">
        <div id="status">Starting WebGPU...</div>

        <div id="progressOuter">
            <div id="progressBar"></div>
        </div>

        <div id="progressText">Preparing model...</div>
    </div>

    <div id="heatBox">
        <div id="heatTop">
            <span>AI SYSTEM LOAD</span>
            <span id="heatValue">Cool</span>
        </div>

        <div id="heatOuter">
            <div id="heatBar"></div>
        </div>

        <div id="heatNote">
            Estimated workload — not actual device temperature
        </div>
    </div>

    <div id="chat">
        <div class="msg bot">
            <span class="label">Qwen:</span>
            Loading local AI...
        </div>
    </div>

    <div id="inputArea">
        <input
            id="input"
            type="text"
            placeholder="Talk to Qwen..."
            disabled
        >

        <button id="send" disabled>Send</button>
    </div>

</div>


<script type="module">

/* =========================================================
   LOCAL QWEN3 AI
   ========================================================= */

const MODEL = "onnx-community/Qwen3-0.6B-ONNX";

const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

const heatBar = document.getElementById("heatBar");
const heatValue = document.getElementById("heatValue");

let generator = null;
let busy = false;
let messages = [];


/* =========================================================
   CHAT UI
   ========================================================= */

function addMessage(who, text) {

    const div = document.createElement("div");

    div.className =
        "msg " +
        (who === "You" ? "user" : "bot");

    div.innerHTML =
        '<span class="label">' +
        (who === "You" ? "You:" : "Qwen:") +
        '</span> ';

    const content = document.createElement("span");
    content.textContent = text;

    div.appendChild(content);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return content;
}


/* =========================================================
   HEAT / WORKLOAD INDICATOR
   ========================================================= */

function setHeat(level) {

    let percent = 8;
    let text = "Cool";
    let color = "#22c55e";

    if (level === "loading") {
        percent = 35;
        text = "Loading";
        color = "#facc15";
    }

    if (level === "working") {
        percent = 75;
        text = "High";
        color = "#fb923c";
    }

    if (level === "veryhigh") {
        percent = 92;
        text = "Very High";
        color = "#ef4444";
    }

    if (level === "idle") {
        percent = 8;
        text = "Cool";
        color = "#22c55e";
    }

    heatBar.style.width = percent + "%";
    heatBar.style.background = color;
    heatValue.textContent = text;
}


/* =========================================================
   MODEL LOADING
   ========================================================= */

async function loadAI() {

    try {

        if (!navigator.gpu) {
            throw new Error(
                "WebGPU is not available in this browser."
            );
        }

        statusEl.textContent =
            "Loading Qwen3 locally...";

        progressText.textContent =
            "Downloading model files...";

        setHeat("loading");


        /*
         * Import Transformers.js directly from jsDelivr.
         */
        const {
            pipeline
        } = await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
        );


        /*
         * Load Qwen3.
         *
         * progress_callback gives us the actual model
         * download progress.
         */
        generator = await pipeline(
            "text-generation",
            MODEL,
            {
                device: "webgpu",

                progress_callback: (progress) => {

                    if (!progress) return;


                    /*
                     * Download progress
                     */
                    if (
                        progress.status === "progress" &&
                        typeof progress.progress === "number"
                    ) {

                        const percent =
                            Math.max(
                                0,
                                Math.min(
                                    100,
                                    progress.progress
                                )
                            );

                        progressBar.style.width =
                            percent.toFixed(1) + "%";

                        const file =
                            progress.file || "model file";

                        progressText.textContent =
                            file +
                            " — " +
                            percent.toFixed(1) +
                            "%";
                    }


                    /*
                     * Loading a file
                     */
                    if (
                        progress.status === "initiate"
                    ) {

                        progressText.textContent =
                            "Loading " +
                            (progress.file || "model file") +
                            "...";
                    }


                    /*
                     * File finished
                     */
                    if (
                        progress.status === "done"
                    ) {

                        progressText.textContent =
                            "Loaded " +
                            (progress.file || "file");
                    }
                }
            }
        );


        progressBar.style.width = "100%";

        progressText.textContent =
            "Model loaded successfully.";

        statusEl.textContent =
            "Qwen3 Ready ✓";

        setHeat("idle");

        input.disabled = false;
        send.disabled = false;

        input.placeholder =
            "Talk to Qwen...";

        addMessage(
            "Qwen",
            "I'm ready. Ask me anything."
        );

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "Qwen failed to load";

        progressText.textContent =
            error.message || String(error);

        setHeat("idle");

        addMessage(
            "Qwen",
            "I couldn't load the model. Check the error above."
        );
    }
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    if (!generator || busy) return;

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    busy = true;

    send.disabled = true;
    input.disabled = true;

    setHeat("working");

    addMessage("You", text);

    messages.push({
        role: "user",
        content: text
    });


    const answerElement =
        addMessage("Qwen", "");


    try {

        const output =
            await generator(
                messages,
                {
                    max_new_tokens: 256,

                    temperature: 0.7,

                    do_sample: true,

                    return_full_text: false
                }
            );


        let answer = "";


        if (
            Array.isArray(output) &&
            output.length > 0
        ) {

            const result =
                output[0];

            if (
                result &&
                typeof result.generated_text === "string"
            ) {

                answer =
                    result.generated_text;
            }

            /*
             * Some Transformers.js versions can
             * return generated_text as messages.
             */
            else if (
                result &&
                Array.isArray(result.generated_text)
            ) {

                const last =
                    result.generated_text[
                        result.generated_text.length - 1
                    ];

                if (
                    last &&
                    typeof last.content === "string"
                ) {

                    answer =
                        last.content;
                }
            }
        }


        if (!answer) {
            answer =
                "I generated an empty response.";
        }


        answerElement.textContent =
            answer;


        messages.push({
            role: "assistant",
            content: answer
        });


    } catch (error) {

        console.error(error);

        answerElement.textContent =
            "Error: " +
            (error.message || String(error));
    }


    setHeat("idle");

    busy = false;

    send.disabled = false;
    input.disabled = false;

    input.focus();
}


/* =========================================================
   BUTTON + ENTER
   ========================================================= */

send.addEventListener(
    "click",
    sendMessage
);

input.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   DRAGGABLE WINDOW
   ========================================================= */

const app =
    document.getElementById("app");

const header =
    document.getElementById("header");

let dragging = false;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;


function pointerDown(event) {

    dragging = true;

    const rect =
        app.getBoundingClientRect();

    startX = event.clientX;
    startY = event.clientY;

    startLeft = rect.left;
    startTop = rect.top;

    app.style.transform = "none";

    header.setPointerCapture(
        event.pointerId
    );
}


function pointerMove(event) {

    if (!dragging) return;

    const dx =
        event.clientX - startX;

    const dy =
        event.clientY - startY;

    let newLeft =
        startLeft + dx;

    let newTop =
        startTop + dy;


    const maxLeft =
        window.innerWidth -
        app.offsetWidth;

    const maxTop =
        window.innerHeight -
        app.offsetHeight;


    newLeft =
        Math.max(
            0,
            Math.min(
                maxLeft,
                newLeft
            )
        );

    newTop =
        Math.max(
            0,
            Math.min(
                maxTop,
                newTop
            )
        );


    app.style.left =
        newLeft + "px";

    app.style.top =
        newTop + "px";
}


function pointerUp() {

    dragging = false;
}


header.addEventListener(
    "pointerdown",
    pointerDown
);

header.addEventListener(
    "pointermove",
    pointerMove
);

header.addEventListener(
    "pointerup",
    pointerUp
);

header.addEventListener(
    "pointercancel",
    pointerUp
);


/* =========================================================
   START
   ========================================================= */

loadAI();

</script>

</body>
</html>
