<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#chat {
    position: fixed;
    left: 20px;
    top: 20px;

    width: 300px;
    height: 300px;

    background: #181818;
    color: white;

    border-radius: 16px;
    overflow: hidden;

    box-shadow: 0 10px 35px rgba(0,0,0,.4);

    display: flex;
    flex-direction: column;
}

#top {
    height: 42px;
    min-height: 42px;

    background: #242424;

    display: flex;
    align-items: center;

    padding: 0 12px;

    cursor: grab;
    user-select: none;
}

#top:active {
    cursor: grabbing;
}

#name {
    font-weight: 700;
    font-size: 14px;
}

#status {
    margin-left: auto;
    font-size: 10px;
    color: #999;
}

#messages {
    flex: 1;

    overflow-y: auto;

    padding: 8px;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

.message {
    max-width: 90%;

    padding: 7px 9px;

    border-radius: 10px;

    font-size: 13px;

    line-height: 1.35;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #3478f6;
}

.ai {
    align-self: flex-start;
    background: #292929;
}

#inputArea {
    display: flex;

    gap: 5px;

    padding: 7px;

    background: #222;
}

#input {
    min-width: 0;
    flex: 1;

    border: none;
    outline: none;

    border-radius: 9px;

    padding: 8px;

    background: #333;
    color: white;
}

#input::placeholder {
    color: #888;
}

#send {
    width: 42px;

    border: none;

    border-radius: 9px;

    background: #3478f6;

    color: white;

    font-size: 17px;
}

#send:disabled {
    opacity: .4;
}
</style>
</head>

<body>

<div id="chat">

    <div id="top">
        <span id="name">🤖 Local AI</span>
        <span id="status">Loading...</span>
    </div>

    <div id="messages">
        <div class="message ai">
            Loading Qwen3...
        </div>
    </div>

    <div id="inputArea">

        <input
            id="input"
            placeholder="Ask something..."
            disabled
        >

        <button id="send" disabled>
            ➤
        </button>

    </div>

</div>

<script type="module">

import {
    pipeline,
    TextStreamer
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

let generator = null;

let conversation = [];

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}

async function loadAI() {

    try {

        status.textContent = "Loading...";

        generator = await pipeline(
            "text-generation",
            "onnx-community/Qwen3-0.6B-ONNX",
            {
                device: "webgpu"
            }
        );

        status.textContent = "Ready";

        messages.innerHTML = "";

        addMessage(
            "Qwen3 is ready. Ask me anything!",
            "ai"
        );

        input.disabled = false;
        send.disabled = false;

        input.focus();

    } catch (error) {

        console.error(error);

        status.textContent = "Failed";

        messages.innerHTML = "";

        addMessage(
            "AI failed to load.\n\n" +
            error.message,
            "ai"
        );

    }
}

async function ask() {

    const question = input.value.trim();

    if (!question || !generator) {
        return;
    }

    input.value = "";

    input.disabled = true;
    send.disabled = true;

    addMessage(question, "user");

    conversation.push({
        role: "user",
        content: question
    });

    const answerBox = addMessage("", "ai");

    try {

        const streamer = new TextStreamer(
            generator.tokenizer,
            {
                skip_prompt: true,

                callback_function: (token) => {

                    answerBox.textContent += token;

                    messages.scrollTop =
                        messages.scrollHeight;
                }
            }
        );

        const result = await generator(
            conversation,
            {
                max_new_tokens: 256,

                temperature: 0.7,

                do_sample: true,

                streamer: streamer
            }
        );

        if (!answerBox.textContent.trim()) {

            const generated =
                result?.[0]?.generated_text;

            if (typeof generated === "string") {

                answerBox.textContent =
                    generated;
            }
        }

        conversation.push({
            role: "assistant",
            content: answerBox.textContent
        });

    } catch (error) {

        answerBox.textContent =
            "Error: " + error.message;

    }

    input.disabled = false;
    send.disabled = false;

    input.focus();
}

send.addEventListener(
    "click",
    ask
);

input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            ask();
        }

    }
);


// -------------------------
// DRAGGABLE WINDOW
// -------------------------

const chat =
    document.getElementById("chat");

const top =
    document.getElementById("top");

let dragging = false;

let offsetX = 0;
let offsetY = 0;

top.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        const rect =
            chat.getBoundingClientRect();

        offsetX =
            event.clientX - rect.left;

        offsetY =
            event.clientY - rect.top;

        top.setPointerCapture(
            event.pointerId
        );
    }
);

top.addEventListener(
    "pointermove",
    event => {

        if (!dragging) return;

        chat.style.left =
            (event.clientX - offsetX) + "px";

        chat.style.top =
            (event.clientY - offsetY) + "px";
    }
);

top.addEventListener(
    "pointerup",
    () => {

        dragging = false;
    }
);


// START AI

loadAI();

</script>

</body>
</html>
