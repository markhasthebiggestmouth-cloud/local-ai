<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#chat {
    position: fixed;
    width: 300px;
    height: 300px;
    left: 20px;
    top: 20px;
    background: #181818;
    color: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    display: flex;
    flex-direction: column;
}

#title {
    height: 42px;
    background: #252525;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-weight: bold;
    cursor: move;
    user-select: none;
}

#status {
    margin-left: auto;
    font-size: 11px;
    color: #aaa;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    font-size: 13px;
}

.msg {
    margin: 6px 0;
    padding: 7px 9px;
    border-radius: 10px;
    white-space: pre-wrap;
}

.user {
    background: #3b82f6;
    margin-left: 25px;
}

.ai {
    background: #292929;
    margin-right: 25px;
}

#bottom {
    display: flex;
    padding: 7px;
    gap: 5px;
    background: #222;
}

#input {
    flex: 1;
    border: none;
    outline: none;
    border-radius: 9px;
    padding: 8px;
    background: #333;
    color: white;
}

#send {
    width: 45px;
    border: none;
    border-radius: 9px;
    background: #3b82f6;
    color: white;
    font-size: 18px;
}
</style>
</head>

<body>

<div id="chat">

    <div id="title">
        🤖 Local AI
        <span id="status">Loading...</span>
    </div>

    <div id="messages">
        <div class="msg ai">Loading local AI...</div>
    </div>

    <div id="bottom">
        <input id="input" placeholder="Ask me something..." disabled>
        <button id="send" disabled>➤</button>
    </div>

</div>

<script type="module">

import {
    pipeline,
    TextStreamer
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

let generator;
let history = [];

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
}

async function startAI() {

    try {

        status.textContent = "Loading...";

        generator = await pipeline(
            "text-generation",
            "onnx-community/Qwen3-0.6B-ONNX",
            {
                device: "webgpu",
                dtype: "q4f16"
            }
        );

        status.textContent = "Ready";

        messages.innerHTML = "";
        addMessage(
            "I'm ready! Ask me anything.",
            "ai"
        );

        input.disabled = false;
        send.disabled = false;
        input.focus();

    } catch (error) {

        status.textContent = "Error";

        messages.innerHTML = "";

        addMessage(
            "Couldn't load the local AI.\n\n" +
            error,
            "ai"
        );

        console.error(error);
    }
}

async function askAI() {

    const text = input.value.trim();

    if (!text || !generator) return;

    input.value = "";
    input.disabled = true;
    send.disabled = true;

    addMessage(text, "user");

    history.push({
        role: "user",
        content: text
    });

    const responseBox = addMessage("", "ai");

    try {

        const output = await generator(history, {
            max_new_tokens: 256,
            temperature: 0.7,
            do_sample: true,
            streamer: new TextStreamer(
                generator.tokenizer,
                {
                    skip_prompt: true,
                    callback_function: (token) => {
                        responseBox.textContent += token;
                        messages.scrollTop = messages.scrollHeight;
                    }
                }
            )
        });

        let answer = "";

        if (
            output &&
            output[0] &&
            output[0].generated_text
        ) {
            const generated = output[0].generated_text;

            if (Array.isArray(generated)) {
                const last = generated[generated.length - 1];

                if (last && last.content) {
                    answer = last.content;
                }
            } else {
                answer = generated;
            }
        }

        if (answer && !responseBox.textContent) {
            responseBox.textContent = answer;
        }

        history.push({
            role: "assistant",
            content: responseBox.textContent
        });

    } catch (error) {

        responseBox.textContent =
            "Error: " + error;

    } finally {

        input.disabled = false;
        send.disabled = false;
        input.focus();

    }
}

send.onclick = askAI;

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        askAI();
    }
});

startAI();


// DRAG WINDOW

const chat = document.getElementById("chat");
const title = document.getElementById("title");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

title.addEventListener("pointerdown", e => {

    dragging = true;

    const rect = chat.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    title.setPointerCapture(e.pointerId);
});

title.addEventListener("pointermove", e => {

    if (!dragging) return;

    chat.style.left =
        (e.clientX - offsetX) + "px";

    chat.style.top =
        (e.clientY - offsetY) + "px";
});

title.addEventListener("pointerup", () => {
    dragging = false;
});

</script>

</body>
</html>
