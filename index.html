<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Local Qwen AI V6</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
}

/* V6 WALLPAPER */
body{
    background:
        radial-gradient(circle at 10% 10%,#00e5ff 0%,transparent 25%),
        radial-gradient(circle at 90% 20%,#7c3aed 0%,transparent 28%),
        radial-gradient(circle at 50% 100%,#ec4899 0%,transparent 32%),
        linear-gradient(135deg,#020617,#0f172a,#030712);
}

#app{
    position:absolute;
    width:300px;
    height:300px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    background:rgba(3,7,18,.94);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 40px rgba(0,229,255,.18);

    overflow:hidden;
}

#header{
    height:42px;
    display:flex;
    align-items:center;
    padding:0 12px;

    background:rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.08);

    cursor:grab;
    user-select:none;
    touch-action:none;
}

#header:active{
    cursor:grabbing;
}

#dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00e5ff;
    box-shadow:0 0 14px #00e5ff;
    margin-right:8px;
}

#title{
    font-size:13px;
    font-weight:700;
}

#version{
    margin-left:auto;
    font-size:9px;
    opacity:.45;
}

#statusArea{
    padding:9px 12px 4px;
}

#status{
    font-size:11px;
    margin-bottom:5px;
    color:#e2e8f0;
}

#file{
    font-size:9px;
    color:#94a3b8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:5px;
}

#progressOuter{
    height:9px;
    width:100%;
    border-radius:99px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
}

#progressBar{
    width:0%;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#00e5ff,#8b5cf6,#ec4899);
    transition:width:.15s linear;
}

#progressInfo{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    font-size:9px;
    color:#94a3b8;
}

#files{
    height:45px;
    margin:3px 12px 2px;
    padding:5px 7px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:8px;

    overflow-y:auto;
    font-size:8px;
    color:#64748b;
}

.fileDone{
    color:#86efac;
    margin-bottom:2px;
}

/* HEAT */

#heatBox{
    margin:3px 12px 5px;
    padding:6px 8px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-radius:9px;
}

#heatTop{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    margin-bottom:4px;
}

#heatValue{
    font-weight:700;
}

#heatOuter{
    width:100%;
    height:6px;
    background:rgba(255,255,255,.08);
    border-radius:99px;
    overflow:hidden;
}

#heatBar{
    width:5%;
    height:100%;
    background:#22c55e;
    border-radius:99px;
    transition:width .4s,background .4s;
}

#heatNote{
    margin-top:3px;
    font-size:7px;
    color:#64748b;
}

/* CHAT */

#chat{
    position:absolute;
    top:160px;
    bottom:48px;
    left:0;
    right:0;

    padding:7px 11px;

    overflow-y:auto;
    font-size:11px;
}

.msg{
    margin-bottom:8px;
    line-height:1.4;
    white-space:pre-wrap;
    word-break:break-word;
}

.user{
    color:#c4b5fd;
}

.bot{
    color:#e2e8f0;
}

.label{
    font-weight:700;
}

#inputArea{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;

    display:flex;
    gap:6px;
}

#input{
    flex:1;
    min-width:0;

    height:32px;
    padding:0 9px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;

    background:rgba(255,255,255,.06);
    color:white;
    outline:none;

    font-size:11px;
}

#send{
    width:48px;

    border:0;
    border-radius:9px;

    background:#7c3aed;
    color:white;
    font-weight:700;

    cursor:pointer;
}

#send:disabled{
    opacity:.4;
}
</style>
</head>

<body>

<div id="app">

    <div id="header">
        <div id="dot"></div>
        <div id="title">Local Qwen AI</div>
        <div id="version">V6</div>
    </div>

    <div id="statusArea">

        <div id="status">
            Starting local AI...
        </div>

        <div id="file">
            Waiting for model files...
        </div>

        <div id="progressOuter">
            <div id="progressBar"></div>
        </div>

        <div id="progressInfo">
            <span id="percent">0%</span>
            <span id="bytes">0 MB / ? MB</span>
        </div>

    </div>

    <div id="files">
        No files loaded yet.
    </div>

    <div id="heatBox">

        <div id="heatTop">
            <span>AI SYSTEM LOAD</span>
            <span id="heatValue">Cool</span>
        </div>

        <div id="heatOuter">
            <div id="heatBar"></div>
        </div>

        <div id="heatNote">
            Estimated workload — not actual device temperature
        </div>

    </div>

    <div id="chat">

        <div class="msg bot">
            <span class="label">Qwen:</span>
            Loading Qwen3 locally...
        </div>

    </div>

    <div id="inputArea">

        <input
            id="input"
            placeholder="Talk to Qwen..."
            disabled
        >

        <button id="send" disabled>
            Send
        </button>

    </div>

</div>


<script type="module">

const MODEL =
    "onnx-community/Qwen3-0.6B-ONNX";

const statusEl =
    document.getElementById("status");

const fileEl =
    document.getElementById("file");

const progressBar =
    document.getElementById("progressBar");

const percentEl =
    document.getElementById("percent");

const bytesEl =
    document.getElementById("bytes");

const filesEl =
    document.getElementById("files");

const heatBar =
    document.getElementById("heatBar");

const heatValue =
    document.getElementById("heatValue");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");


let generator = null;
let busy = false;

let messages = [];


/* =========================================
   FORMAT MB
========================================= */

function mb(bytes){

    if(!bytes || !isFinite(bytes)){
        return "?";
    }

    return (
        bytes / 1024 / 1024
    ).toFixed(1);
}


/* =========================================
   HEAT ESTIMATE
========================================= */

function heat(type){

    let width = 5;
    let color = "#22c55e";
    let text = "Cool";

    if(type === "loading"){
        width = 30;
        color = "#facc15";
        text = "Loading";
    }

    if(type === "working"){
        width = 75;
        color = "#fb923c";
        text = "High";
    }

    heatBar.style.width =
        width + "%";

    heatBar.style.background =
        color;

    heatValue.textContent =
        text;
}


/* =========================================
   CHAT MESSAGE
========================================= */

function addMessage(who,text){

    const div =
        document.createElement("div");

    div.className =
        "msg " +
        (who === "You"
            ? "user"
            : "bot");

    const label =
        document.createElement("span");

    label.className =
        "label";

    label.textContent =
        who === "You"
            ? "You: "
            : "Qwen: ";

    const content =
        document.createElement("span");

    content.textContent =
        text;

    div.appendChild(label);
    div.appendChild(content);

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return content;
}


/* =========================================
   MODEL LOADING
========================================= */

async function loadAI(){

    try{

        if(!navigator.gpu){

            throw new Error(
                "WebGPU is not available."
            );
        }

        heat("loading");

        statusEl.textContent =
            "Loading Qwen3...";

        fileEl.textContent =
            "Checking model files...";


        const {
            pipeline
        } = await import(
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
        );


        generator =
            await pipeline(
                "text-generation",
                MODEL,
                {

                    device:"webgpu",

                    /*
                     * This matches the official
                     * Qwen3 WebGPU example.
                     */
                    dtype:"q4f16",

                    progress_callback:
                        (p)=>{

                            if(!p) return;


                            /* FILE START */

                            if(
                                p.status ===
                                "initiate"
                            ){

                                fileEl.textContent =
                                    "Downloading: " +
                                    (p.file || "file");

                                progressBar.style.width =
                                    "0%";

                                percentEl.textContent =
                                    "0%";

                                bytesEl.textContent =
                                    "0 MB / " +
                                    mb(p.total) +
                                    " MB";

                                heat("loading");
                            }


                            /* PROGRESS */

                            if(
                                p.status ===
                                "progress"
                            ){

                                let value =
                                    Number(
                                        p.progress
                                    );

                                if(
                                    !isFinite(value)
                                ){
                                    value = 0;
                                }

                                value =
                                    Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            value
                                        )
                                    );


                                progressBar.style.width =
                                    value.toFixed(1) +
                                    "%";

                                percentEl.textContent =
                                    value.toFixed(1) +
                                    "%";


                                const loaded =
                                    p.loaded || 0;

                                const total =
                                    p.total || 0;


                                bytesEl.textContent =
                                    mb(loaded) +
                                    " MB / " +
                                    mb(total) +
                                    " MB";


                                fileEl.textContent =
                                    "Downloading: " +
                                    (p.file ||
                                        "model file");
                            }


                            /* FILE DONE */

                            if(
                                p.status ===
                                "done"
                            ){

                                fileEl.textContent =
                                    "Finished: " +
                                    (p.file ||
                                        "file");


                                const done =
                                    document.createElement(
                                        "div"
                                    );

                                done.className =
                                    "fileDone";

                                done.textContent =
                                    "✓ " +
                                    (p.file ||
                                        "file");

                                if(
                                    filesEl.textContent ===
                                    "No files loaded yet."
                                ){
                                    filesEl.textContent =
                                        "";
                                }

                                filesEl.appendChild(
                                    done
                                );
                            }
                        }
                }
            );


        /* =================================
           READY
        ================================= */

        progressBar.style.width =
            "100%";

        percentEl.textContent =
            "100%";

        statusEl.textContent =
            "Qwen3 Ready ✓";

        fileEl.textContent =
            "All model files loaded.";

        bytesEl.textContent =
            "Model ready";

        heat("loading");


        input.disabled =
            false;

        send.disabled =
            false;

        addMessage(
            "Qwen",
            "I'm ready. Ask me anything."
        );


        setTimeout(
            ()=>heat("idle"),
            1000
        );


    }catch(error){

        console.error(error);

        statusEl.textContent =
            "Qwen3 failed to load";

        fileEl.textContent =
            error.message ||
            String(error);

        addMessage(
            "Qwen",
            "Model loading failed. See the loading message above."
        );
    }
}


/* =========================================
   SEND
========================================= */

async function sendMessage(){

    if(
        !generator ||
        busy
    ){
        return;
    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    input.value = "";

    busy = true;

    input.disabled =
        true;

    send.disabled =
        true;

    heat("working");

    addMessage(
        "You",
        text
    );

    messages.push({
        role:"user",
        content:text
    });

    const answer =
        addMessage(
            "Qwen",
            ""
        );


    try{

        const output =
            await generator(
                messages,
                {
                    max_new_tokens:256,
                    do_sample:false,
                    return_full_text:false
                }
            );


        let result = "";


        if(
            output &&
            output[0]
        ){

            const generated =
                output[0]
                    .generated_text;


            if(
                typeof generated ===
                "string"
            ){

                result =
                    generated;
            }

            else if(
                Array.isArray(
                    generated
                )
            ){

                const last =
                    generated[
                        generated.length - 1
                    ];

                if(
                    last &&
                    typeof last.content ===
                    "string"
                ){

                    result =
                        last.content;
                }
            }
        }


        if(!result){
            result =
                "Qwen returned an empty response.";
        }


        answer.textContent =
            result;


        messages.push({
            role:"assistant",
            content:result
        });


    }catch(error){

        console.error(error);

        answer.textContent =
            "Error: " +
            (
                error.message ||
                String(error)
            );
    }


    busy = false;

    input.disabled =
        false;

    send.disabled =
        false;

    heat("idle");

    input.focus();
}


/* =========================================
   INPUT
========================================= */

send.addEventListener(
    "click",
    sendMessage
);

input.addEventListener(
    "keydown",
    (event)=>{

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================
   DRAG WINDOW
========================================= */

const app =
    document.getElementById("app");

const header =
    document.getElementById("header");

let dragging = false;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;


header.addEventListener(
    "pointerdown",
    (event)=>{

        dragging = true;

        const rect =
            app.getBoundingClientRect();

        startX =
            event.clientX;

        startY =
            event.clientY;

        startLeft =
            rect.left;

        startTop =
            rect.top;

        app.style.transform =
            "none";

        header.setPointerCapture(
            event.pointerId
        );
    }
);


header.addEventListener(
    "pointermove",
    (event)=>{

        if(!dragging){
            return;
        }

        const dx =
            event.clientX -
            startX;

        const dy =
            event.clientY -
            startY;

        let left =
            startLeft + dx;

        let top =
            startTop + dy;


        left =
            Math.max(
                0,
                Math.min(
                    window.innerWidth -
                    app.offsetWidth,
                    left
                )
            );


        top =
            Math.max(
                0,
                Math.min(
                    window.innerHeight -
                    app.offsetHeight,
                    top
                )
            );


        app.style.left =
            left + "px";

        app.style.top =
            top + "px";
    }
);


header.addEventListener(
    "pointerup",
    ()=>{
        dragging = false;
    }
);

header.addEventListener(
    "pointercancel",
    ()=>{
        dragging = false;
    }
);


/* =========================================
   START
========================================= */

loadAI();

</script>

</body>
</html>
