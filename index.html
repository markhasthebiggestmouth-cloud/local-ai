<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local AI v3</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    /* NEW WALLPAPER */
    background:
        radial-gradient(circle at 20% 20%, #7c3aed 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #2563eb 0%, transparent 35%),
        linear-gradient(135deg, #09001a, #17002e, #00152e);

    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* small version marker */
#version {
    position: fixed;
    right: 10px;
    bottom: 8px;
    color: rgba(255,255,255,.35);
    font-size: 10px;
}

/* CHAT WINDOW */

#chat {
    position: fixed;

    left: 20px;
    top: 20px;

    width: 300px;
    height: 300px;

    background: #151515;

    color: white;

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 15px 50px rgba(0,0,0,.55),
        0 0 30px rgba(124,58,237,.25);

    display: flex;
    flex-direction: column;
}

/* HEADER */

#top {
    height: 42px;
    min-height: 42px;

    background: linear-gradient(
        90deg,
        #3b0764,
        #172554
    );

    display: flex;
    align-items: center;

    padding: 0 12px;

    cursor: grab;

    user-select: none;
}

#top:active {
    cursor: grabbing;
}

#name {
    font-weight: 700;
    font-size: 14px;
}

#status {
    margin-left: auto;

    font-size: 10px;

    color: #c4b5fd;
}

/* MESSAGES */

#messages {
    flex: 1;

    overflow-y: auto;

    padding: 8px;

    display: flex;
    flex-direction: column;

    gap: 6px;
}

.message {
    max-width: 90%;

    padding: 7px 9px;

    border-radius: 10px;

    font-size: 13px;

    line-height: 1.35;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;

    background: #6d28d9;
}

.ai {
    align-self: flex-start;

    background: #292929;
}

/* INPUT */

#inputArea {
    display: flex;

    gap: 5px;

    padding: 7px;

    background: #202020;
}

#input {
    min-width: 0;

    flex: 1;

    border: none;

    outline: none;

    border-radius: 9px;

    padding: 8px;

    background: #333;

    color: white;
}

#input::placeholder {
    color: #888;
}

#send {
    width: 42px;

    border: none;

    border-radius: 9px;

    background: #7c3aed;

    color: white;

    font-size: 17px;
}

#send:disabled {
    opacity: .4;
}
</style>
</head>

<body>

<div id="chat">

    <div id="top">

        <span id="name">
            🤖 Local AI v3
        </span>

        <span id="status">
            Starting...
        </span>

    </div>

    <div id="messages">

        <div class="message ai">
            Starting local AI...
        </div>

    </div>

    <div id="inputArea">

        <input
            id="input"
            placeholder="Ask something..."
            disabled
        >

        <button id="send" disabled>
            ➤
        </button>

    </div>

</div>

<div id="version">
    LOCAL AI v3
</div>


<script type="module">

/*
    LOCAL AI v3

    Qwen3 WebGPU
*/

import {
    pipeline,
    TextStreamer
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const messages =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const status =
    document.getElementById("status");


let generator = null;

let conversation = [];


/* ADD MESSAGE */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return message;
}


/* LOAD AI */

async function loadAI() {

    try {

        status.textContent =
            "Loading Qwen3...";

        /*
            IMPORTANT:

            Start with the basic WebGPU
            configuration that the
            working Qwen3 demo uses.
        */

        generator = await pipeline(

            "text-generation",

            "onnx-community/Qwen3-0.6B-ONNX",

            {
                device: "webgpu"
            }

        );


        status.textContent =
            "Ready";

        messages.innerHTML = "";

        addMessage(
            "Qwen3 is ready! Ask me something.",
            "ai"
        );

        input.disabled = false;

        send.disabled = false;

        input.focus();


    } catch (error) {

        console.error(error);

        status.textContent =
            "ERROR";

        messages.innerHTML = "";

        addMessage(
            "Qwen3 could not start.\n\n" +
            error.name +
            "\n\n" +
            error.message,
            "ai"
        );

    }

}


/* ASK AI */

async function ask() {

    const question =
        input.value.trim();

    if (!question || !generator) {
        return;
    }


    input.value = "";

    input.disabled = true;

    send.disabled = true;


    addMessage(
        question,
        "user"
    );


    conversation.push({

        role: "user",

        content: question

    });


    const answer =
        addMessage("", "ai");


    try {

        const streamer =
            new TextStreamer(

                generator.tokenizer,

                {

                    skip_prompt: true,

                    callback_function:
                        (token) => {

                            answer.textContent +=
                                token;

                            messages.scrollTop =
                                messages.scrollHeight;

                        }

                }

            );


        await generator(

            conversation,

            {

                max_new_tokens: 256,

                temperature: 0.7,

                do_sample: true,

                streamer: streamer

            }

        );


        conversation.push({

            role: "assistant",

            content:
                answer.textContent

        });


    } catch (error) {

        answer.textContent =
            "Generation error:\n" +
            error.message;

    }


    input.disabled = false;

    send.disabled = false;

    input.focus();

}


/* BUTTON */

send.addEventListener(
    "click",
    ask
);


/* ENTER */

input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            ask();

        }

    }
);


/* DRAG WINDOW */

const chat =
    document.getElementById("chat");

const top =
    document.getElementById("top");


let dragging = false;

let offsetX = 0;

let offsetY = 0;


top.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        const rect =
            chat.getBoundingClientRect();

        offsetX =
            event.clientX -
            rect.left;

        offsetY =
            event.clientY -
            rect.top;

        top.setPointerCapture(
            event.pointerId
        );

    }
);


top.addEventListener(
    "pointermove",
    event => {

        if (!dragging) return;

        chat.style.left =
            (event.clientX -
            offsetX) + "px";

        chat.style.top =
            (event.clientY -
            offsetY) + "px";

    }
);


top.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


/* START */

loadAI();

</script>

</body>
</html>
